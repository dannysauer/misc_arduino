name: Battery monitor KiCad validation

on:
  push:
    branches:
      - agent/battery-monitor-design
    paths:
      - battery_monitor/hardware/**
      - .github/workflows/battery-monitor-kicad.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad
          kicad-cli version

      - name: Fix generator coordinate transform
        shell: python
        run: |
          from pathlib import Path

          path = Path("battery_monitor/hardware/tools/generate_schematic.py")
          text = path.read_text()
          old = '''def pin_def(ptype,num,name,x,y,ang):
              return f'(pin {ptype} line (at {x} {y} {ang}) (length 2.54) (name "{name}" {eff(0.8)}) (number "{num}" {eff(0.8)}))'
          '''
          new = '''def pin_def(ptype,num,name,x,y,ang):
              # KiCad symbol-local Y increases upward while sheet Y increases downward.
              # The design coordinates below are written in sheet orientation, so mirror
              # the local Y coordinate and vertical pin angle when embedding the symbol.
              return f'(pin {ptype} line (at {x} {-y} {(-ang) % 360}) (length 2.54) (name "{name}" {eff(0.8)}) (number "{num}" {eff(0.8)}))'
          '''
          if old in text:
              path.write_text(text.replace(old, new))
          elif "return f'(pin {ptype} line (at {x} {-y} {(-ang) % 360})" not in text:
              raise SystemExit("generator pin_def block is neither old nor expected fixed form")

      - name: Generate schematic
        run: |
          python3 battery_monitor/hardware/tools/generate_schematic.py
          test -s battery_monitor/hardware/battery_monitor.kicad_sch

      - name: Commit corrected generator and generated schematic
        run: |
          if [ -z "$(git status --porcelain -- battery_monitor/hardware/tools/generate_schematic.py battery_monitor/hardware/battery_monitor.kicad_sch battery_monitor/hardware/battery_monitor.kicad_pro)" ]; then
            echo "Generated KiCad files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battery_monitor/hardware/tools/generate_schematic.py battery_monitor/hardware/battery_monitor.kicad_sch battery_monitor/hardware/battery_monitor.kicad_pro
          git commit -m "Fix KiCad symbol pin coordinate transform"
          git push origin HEAD:agent/battery-monitor-design

      - name: Validate schematic with KiCad
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/kicad-validation
          cp battery_monitor/hardware/battery_monitor.kicad_sch /tmp/kicad-validation/battery_monitor.kicad_sch

          kicad-cli sch upgrade --force \
            /tmp/kicad-validation/battery_monitor.kicad_sch \
            > /tmp/kicad-validation/upgrade.log 2>&1
          upgrade_status=$?

          kicad-cli sch erc \
            --format json \
            --severity-all \
            --output /tmp/kicad-validation/erc.json \
            /tmp/kicad-validation/battery_monitor.kicad_sch \
            > /tmp/kicad-validation/erc-cli.log 2>&1
          erc_status=$?

          if [ -s /tmp/kicad-validation/erc.json ]; then
            total_count=$(jq '[.sheets[].violations[]] | length' /tmp/kicad-validation/erc.json)
            error_count=$(jq '[.sheets[].violations[] | select(.severity == "error")] | length' /tmp/kicad-validation/erc.json)
            warning_count=$(jq '[.sheets[].violations[] | select(.severity == "warning")] | length' /tmp/kicad-validation/erc.json)
          else
            total_count=0
            error_count=0
            warning_count=0
          fi

          echo "upgrade_status=${upgrade_status}" >> "$GITHUB_OUTPUT"
          echo "erc_status=${erc_status}" >> "$GITHUB_OUTPUT"
          echo "total_count=${total_count}" >> "$GITHUB_OUTPUT"
          echo "error_count=${error_count}" >> "$GITHUB_OUTPUT"
          echo "warning_count=${warning_count}" >> "$GITHUB_OUTPUT"

          {
            echo "## KiCad 10 validation"
            echo
            echo "- KiCad version: \`$(kicad-cli version)\`"
            echo "- Parser/upgrade exit code: \`${upgrade_status}\`"
            echo "- ERC command exit code: \`${erc_status}\`"
            echo "- ERC violations: **${total_count} total / ${error_count} errors / ${warning_count} warnings**"
            echo
            echo "### Violation types"
            if [ -s /tmp/kicad-validation/erc.json ]; then
              jq -r '[.sheets[].violations[]] | group_by(.type) | sort_by(-length) | .[] | "- `\(.[0].type)`: \(length) (\(.[0].severity))"' /tmp/kicad-validation/erc.json
              echo
              echo "### First 30 errors"
              jq -r '[.sheets[].violations[] | select(.severity == "error")][0:30][] | "- **\(.type)**: \(.description) — \([.items[].description] | join("; "))"' /tmp/kicad-validation/erc.json
            fi
            echo
            echo "### Parser output"
            echo '```text'
            head -c 4000 /tmp/kicad-validation/upgrade.log
            echo
            echo '```'
          } > /tmp/kicad-validation/comment.md

      - name: Post validation result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/kicad-validation/comment.md ]; then
            gh pr comment 4 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/kicad-validation/comment.md
          else
            gh pr comment 4 --repo "${GITHUB_REPOSITORY}" --body "KiCad validation did not reach the reporting step. Check the workflow run."
          fi

      - name: Fail on parser or ERC errors
        if: always()
        run: |
          test "${{ steps.validate.outputs.upgrade_status }}" = "0"
          test "${{ steps.validate.outputs.error_count }}" = "0"
