esphome:
  name: ac-controller
  friendly_name: AC Controller

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf

# 8MB octal PSRAM — required for camera operation
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if WiFi is unavailable
  ap:
    ssid: "AC Controller"
    password: !secret ap_password

captive_portal:

# Home Assistant native API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Set level: INFO after initial setup is complete
logger:
  level: DEBUG

# ═══════════════════════════════════════════════════════════
# STATUS LED
# Amber user LED on the XIAO board (active-low)
# ═══════════════════════════════════════════════════════════
light:
  - platform: status_led
    name: "Status LED"
    id: status_led
    pin:
      number: GPIO21
      inverted: true

# ═══════════════════════════════════════════════════════════
# CAMERA — OV2640
#
# Pin assignments for Seeed Studio XIAO ESP32S3 Sense.
# These are internal to the Sense expansion board and are
# fixed; do not change them.
# ═══════════════════════════════════════════════════════════
esp32_camera:
  name: "AC Display Camera"
  external_clock:
    pin: GPIO10
    frequency: 20MHz
  i2c_pins:
    sda: GPIO40
    scl: GPIO39
  data_pins: [GPIO15, GPIO17, GPIO18, GPIO16, GPIO14, GPIO12, GPIO11, GPIO48]
  vsync_pin: GPIO38
  href_pin: GPIO47
  pixel_clock_pin: GPIO13
  # Resolution: 800x600 gives enough detail for 7-segment OCR without
  # overloading the WiFi radio. Drop to 640x480 if you get disconnects.
  resolution: 800x600
  jpeg_quality: 10
  max_framerate: 5fps
  idle_framerate: 0.1fps
  # Tweak contrast/brightness after mounting to maximize OCR accuracy
  contrast: 1
  brightness: 0
  saturation: 0
  vertical_flip: false
  horizontal_mirror: false

# MJPEG web server for:
#   - go2rtc re-streaming to Frigate  (stream on :8080)
#   - Periodic snapshots for HA image_processing  (snapshot on :8081)
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# ═══════════════════════════════════════════════════════════
# IR TRANSMITTER
#
# Hardware: 940nm IR LED (e.g. TSAL6400) + 100Ω resistor
# Wiring:   GPIO4 (D3) → 100Ω → LED anode → LED cathode → GND
#
# Direct GPIO drive is sufficient for ≤2m range. The ESP32-S3
# GPIO is rated 40mA max; at 38kHz/50% duty the LED averages
# ~10mA, well within limits.
#
# For longer range: use an NPN transistor (BC547 / 2N3904):
#   GPIO4 → 1kΩ → base; collector → LED anode; LED cathode → GND;
#   emitter → GND; 5V or 3.3V → LED via 10–33Ω resistor.
# ═══════════════════════════════════════════════════════════
remote_transmitter:
  pin: GPIO4   # D3 on XIAO header
  carrier_duty_percent: 50%

# ═══════════════════════════════════════════════════════════
# IR RECEIVER (VS1838B)
#
# Hardware: VS1838B pin 1 (OUT) → GPIO3 (D2), pin 2 → GND, pin 3 → 3V3
# No external resistor or capacitor needed; the VS1838B includes
# a demodulator and internal filter.
#
# HOW TO LEARN CODES:
#   1. Flash this firmware and open the ESPHome log viewer
#   2. Point your AC remote directly at the VS1838B from ~10-20cm
#   3. Press each button you want to capture
#   4. Copy the "Raw:" line from the log into the corresponding
#      button's code: [] array below
#   5. Set logger level: INFO once done to reduce log noise
# ═══════════════════════════════════════════════════════════
remote_receiver:
  pin:
    number: GPIO3   # D2 on XIAO header
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 25%

# ═══════════════════════════════════════════════════════════
# AC CONTROL BUTTONS
#
# Replace each empty code: [] with the raw values captured
# from the VS1838B log. Values are in microseconds;
# positive = mark (carrier on), negative = space (carrier off).
#
# Example (typical NEC-like AC remote):
#   code: [9000, -4500, 560, -560, 560, -1680, 560, -560, ...]
#
# Once you know the AC brand/protocol, you may be able to
# replace these raw buttons with ESPHome's climate.ir component
# for a cleaner HA climate entity (check esphome.io/components/
# climate/climate_ir.html for supported protocols).
# ═══════════════════════════════════════════════════════════
button:
  - platform: template
    name: "AC Power Toggle"
    icon: mdi:power
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: []  # TODO: paste learned code here

