# ═══════════════════════════════════════════════════════════
# MICROPHONE (PDM)
#
# The XIAO ESP32S3 Sense has a built-in PDM microphone
# (MSM261D3526H1CPM) on the Sense expansion board.
# GPIO42 = PDM clock, GPIO41 = PDM data.
#
# Used here for the HA voice assistant (Assist pipeline).
# Note: TTS spoken responses require a speaker wired to an
# i2s_audio DAC output. Without one, commands are received
# and processed but not spoken back.
# ═══════════════════════════════════════════════════════════
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO42   # PDM CLK
    i2s_din_pin: GPIO41     # PDM DATA

microphone:
  - platform: i2s_audio
    i2s_audio_id: i2s_in
    id: ac_mic
    adc_type: external
    pdm: true

# Voice assistant — integrates with Home Assistant Assist pipeline.
# Requires HA 2023.10+ with at least one Assist pipeline configured.
# Use the amber status LED as a listening indicator.
voice_assistant:
  microphone: ac_mic
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - light.turn_on:
        id: status_led
        effect: none
  on_end:
    - light.turn_off: status_led
  on_error:
    - light.turn_on: status_led

# ═══════════════════════════════════════════════════════════
# SENSORS
# ═══════════════════════════════════════════════════════════
sensor:
  - platform: wifi_signal
    name: "AC Controller WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "AC Controller Uptime"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "AC Controller IP"
