# Home Assistant configuration for ac-controller
# These snippets go in HA config files, not in the ESPHome YAML.
#
# STATE READING PHILOSOPHY
# ─────────────────────────────────────────────────────────────
# The XIAO camera is the source of truth for AC state. The AC can
# be controlled by the physical remote, wall buttons, or this ESPHome
# device — so ESPHome's IR buttons are write-only. All state is read
# from the camera via ac_display_reader.py (see that file).
#
# Z-WAVE OUTLET
# ─────────────────────────────────────────────────────────────
# A Z-wave smart outlet already in HA controls power and reports
# power consumption. When it reports ~0W, the AC is off and all
# LED sensors should be treated as unknown/off regardless of what
# the camera sees. Wire this in via the template sensors below.


# ═══════════════════════════════════════════════════════════
# DISPLAY READING — command_line sensor driving everything
#
# The ac_display_reader.py script (see that file) downloads one
# snapshot and returns all states as JSON in a single pass:
#   temperature, mode LEDs, fan LEDs, filter LED.
#
# Requires on the HA host:
#   - Python 3 with Pillow:  apk add py3-pillow   (HA OS via SSH add-on)
#                        or:  pip install Pillow    (manual/Docker installs)
#   - ssocr for 7-segment:   apk add ssocr
#     (if ssocr unavailable, set SSOCR_PATH=None in the script to skip
#      temperature and use only image_processing.seven_segments instead)
#
# Copy ac_display_reader.py.template to /config/scripts/ac_display_reader.py
# and calibrate the ROI coordinates before enabling.
# ═══════════════════════════════════════════════════════════
sensor:
  - platform: command_line
    name: "AC Display State"
    unique_id: ac_display_state
    # Adjust path if your HA scripts directory differs
    command: "python3 /config/scripts/ac_display_reader.py"
    scan_interval: 5   # seconds; increase if CPU load is a concern
    value_template: "{{ value_json.temperature | default('unknown') }}"
    json_attributes:
      - temperature
      - mode_cool
      - mode_heat
      - mode_fan_only
      - mode_dry
      - mode_auto
      - fan_low
      - fan_medium
      - fan_high
      - filter_change
    availability_template: >
      {{ states('switch.ac_outlet') != 'unavailable' }}


# ═══════════════════════════════════════════════════════════
# TEMPLATE SENSORS — parsed from the JSON above
#
# The Z-wave outlet entity is assumed to be switch.ac_outlet and
# sensor.ac_outlet_power (adjust to match your actual entity IDs).
# When the outlet reports low power, the AC is off and all indicator
# states are forced to false.
# ═══════════════════════════════════════════════════════════
template:
  - sensor:
      - name: "AC Temperature Display"
        unique_id: ac_temperature_display
        unit_of_measurement: "°"
        state_class: measurement
        icon: mdi:thermometer
        state: >
          {% if states('sensor.ac_outlet_power') | float(0) < 5 %}
            unknown
          {% else %}
            {{ state_attr('sensor.ac_display_state', 'temperature') | default('unknown') }}
          {% endif %}

      - name: "AC Current Mode"
        unique_id: ac_current_mode
        icon: mdi:air-conditioner
        state: >
          {% if states('sensor.ac_outlet_power') | float(0) < 5 %}
            off
          {% elif state_attr('sensor.ac_display_state', 'mode_cool') %}
            cool
          {% elif state_attr('sensor.ac_display_state', 'mode_heat') %}
            heat
          {% elif state_attr('sensor.ac_display_state', 'mode_fan_only') %}
            fan_only
          {% elif state_attr('sensor.ac_display_state', 'mode_dry') %}
            dry
          {% elif state_attr('sensor.ac_display_state', 'mode_auto') %}
            auto
          {% else %}
            unknown
          {% endif %}

      - name: "AC Fan Speed"
        unique_id: ac_fan_speed
        icon: mdi:fan
        state: >
          {% if states('sensor.ac_outlet_power') | float(0) < 5 %}
            off
          {% elif state_attr('sensor.ac_display_state', 'fan_high') %}
            high
          {% elif state_attr('sensor.ac_display_state', 'fan_medium') %}
            medium
          {% elif state_attr('sensor.ac_display_state', 'fan_low') %}
            low
          {% else %}
            unknown
          {% endif %}

  - binary_sensor:
      - name: "AC Filter Change"
        unique_id: ac_filter_change
        device_class: problem
        icon: mdi:air-filter
        state: >
          {{ state_attr('sensor.ac_display_state', 'filter_change') | default(false) }}

      # Individual mode LEDs (useful for dashboards / automations)
      - name: "AC Mode Cool LED"
        unique_id: ac_mode_cool_led
        state: "{{ state_attr('sensor.ac_display_state', 'mode_cool') | default(false) }}"
      - name: "AC Mode Heat LED"
        unique_id: ac_mode_heat_led
        state: "{{ state_attr('sensor.ac_display_state', 'mode_heat') | default(false) }}"
      - name: "AC Mode Fan Only LED"
        unique_id: ac_mode_fan_only_led
        state: "{{ state_attr('sensor.ac_display_state', 'mode_fan_only') | default(false) }}"
      - name: "AC Mode Dry LED"
        unique_id: ac_mode_dry_led
        state: "{{ state_attr('sensor.ac_display_state', 'mode_dry') | default(false) }}"
      - name: "AC Mode Auto LED"
        unique_id: ac_mode_auto_led
        state: "{{ state_attr('sensor.ac_display_state', 'mode_auto') | default(false) }}"

      # Individual fan LEDs
      - name: "AC Fan Low LED"
        unique_id: ac_fan_low_led
        state: "{{ state_attr('sensor.ac_display_state', 'fan_low') | default(false) }}"
      - name: "AC Fan Medium LED"
        unique_id: ac_fan_medium_led
        state: "{{ state_attr('sensor.ac_display_state', 'fan_medium') | default(false) }}"
      - name: "AC Fan High LED"
        unique_id: ac_fan_high_led
        state: "{{ state_attr('sensor.ac_display_state', 'fan_high') | default(false) }}"


